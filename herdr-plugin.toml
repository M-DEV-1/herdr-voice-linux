# herdr-voice as a Herdr plugin: https://herdr.dev/docs/plugins/
id = "brogrammermw.herdr-voice"
name = "herdr-voice"
version = "1.4.1"
min_herdr_version = "0.9.0"
description = "Talk to your Herdr agents: realtime Gemini Live voice that drives Claude Code and Codex panes, in a Herdr pane"
platforms = ["linux"]

# Needs Node 22 or newer and PipeWire (pw-record, pw-play). There is nothing to build.
# To put the herdr-voice command on your PATH, run once: node linux/herdr-voice.mjs install-command

# The voice itself: a split pane showing the live transcript. Closing the pane stops it.
[[panes]]
id = "voice"
title = "herdr-voice"
placement = "split"
command = ["node", "linux/herdr-voice.mjs", "--here"]

# Save the Gemini API key to ~/.config/herdr-voice/gemini.key (hidden input).
[[panes]]
id = "setup"
title = "herdr-voice setup"
placement = "popup"
width = "70%"
height = 16
command = ["node", "linux/herdr-voice.mjs", "setup"]

# Same as typing herdr-voice: opens the voice pane below the focused pane. HERDR_VOICE_START_HIDDEN=1
# hides it behind the focused pane instead. Bind it to a key (see the README).
[[actions]]
id = "start"
title = "Start voice"
contexts = ["workspace"]
command = ["node", "linux/herdr-voice.mjs"]

[[actions]]
id = "setup"
title = "Set up an API key"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brogrammermw.herdr-voice --entrypoint setup"]
